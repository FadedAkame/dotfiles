# Font
font_family family="IosevkaTerm Nerd Font Mono" style="Medium"
font_size 18

# Colors
foreground #c5c9c8
background #080a0a

color0  #101313
color8  #45504c

color1  #25282a
color9  #806f75

color2  #303833
color10 #718276

color3  #3d423e
color11 #8a8b72

color4  #3a4147
color12 #6e7f8a

color5  #48454c
color13 #7b7180

color6  #465354
color14 #788b8a

color7  #b9bfbd
color15 #a5aaa5

# Cursor
cursor #aeb7b3
cursor_trail 10
cursor_trail_start_threshold 2
cursor_trail_decay 0.1 0.5
cursor_shape block
disable_ligatures cursor

# Selection
selection_background #3d423e
selection_foreground none

# Window & cursor
cursor_blink_interval 0
window_padding_width 15
confirm_os_window_close 0

# Behavior
scrollback_lines 10000
enable_audio_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 3
shell_integration enabled
url_color #6e7f8a
